name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff formatting
        run: ruff format --check .
      - name: Mypy
        run: mypy src

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -q

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run coverage
        run: >-
          pytest -q
          --cov=ironveil.core.scanner
          --cov=ironveil.policy
          --cov=ironveil.core.masking
          --cov=ironveil.core.fingerprint
          --cov=ironveil.cli
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  package:
    name: Build package
    needs: [quality, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install -e ".[dev]"
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs]"
      - name: Build documentation
        run: mkdocs build --strict
      - name: Generate synthetic demo report
        run: python .github/scripts/generate_demo_report.py site/demo-fixture.json site-build/demo-report.html
      - name: Smoke-test demo report
        run: >-
          python -c "import pathlib;
          t=pathlib.Path('site-build/demo-report.html').read_text(encoding='utf-8');
          assert 'Content-Security-Policy' in t and 'synthetic-fingerprint-001' in t"

  self-scan:
    name: Self-scan and report validation
    needs: [coverage, package, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan IronVeil with IronVeil
        id: ironveil
        uses: ./
        with:
          path: .
          fail-severity: high
          minimum-confidence: medium
          upload-sarif: false
          artifact-name: ironveil-self-scan-html
      - name: Validate SARIF structure
        env:
          SARIF_PATH: ${{ steps.ironveil.outputs.sarif-path }}
        run: >-
          python -c "import json, os, pathlib;
          d=json.loads(pathlib.Path(os.environ['SARIF_PATH']).read_text(encoding='utf-8'));
          assert d['version']=='2.1.0' and isinstance(d['runs'], list) and d['runs']"
      - name: Smoke-test HTML report
        env:
          HTML_PATH: ${{ steps.ironveil.outputs.html-path }}
        run: >-
          python -c "import os, pathlib;
          t=pathlib.Path(os.environ['HTML_PATH']).read_text(encoding='utf-8').lower();
          assert '<!doctype html' in t and '<script src=' not in t"

  trusted-sarif-upload:
    name: Trusted self-scan SARIF upload
    if: github.event_name != 'pull_request'
    needs: [self-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan and upload SARIF
        uses: ./
        with:
          path: .
          fail-severity: high
          minimum-confidence: medium
          upload-sarif: true
          artifact-name: ironveil-trusted-self-scan-html
