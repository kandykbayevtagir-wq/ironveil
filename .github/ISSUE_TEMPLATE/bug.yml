name: Bug report
description: Report reproducible incorrect behavior in IronVeil.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: >-
        Do not paste credentials, unmasked findings, private source code, or sensitive
        repository history. Use GitHub private vulnerability reporting for security issues.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: IronVeil version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.13.5"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use synthetic placeholders and remove proprietary paths or content.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics
      description: Paste only output that you have checked for secrets and private data.
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I verified that this report contains no credential, private source code, or sensitive history.
          required: true
