name: IronVeil repository scan
description: Scan a repository for secrets and security misconfigurations without uploading source code.
author: IronVeil contributors

branding:
  icon: shield
  color: gray-dark

inputs:
  path:
    description: Repository path to scan.
    required: false
    default: .
  fail-severity:
    description: Lowest severity that fails the job.
    required: false
    default: high
  minimum-confidence:
    description: Lowest confidence included in policy evaluation.
    required: false
    default: medium
  upload-sarif:
    description: Attempt to upload SARIF to GitHub Code Scanning. The caller must grant security-events write.
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded HTML report artifact.
    required: false
    default: ironveil-html-report
  retention-days:
    description: Number of days to retain the HTML report artifact.
    required: false
    default: "14"

outputs:
  exit-code:
    description: IronVeil exit code (0 passed, 1 policy findings, 2 error, 3 partial result).
    value: ${{ steps.scan.outputs.exit-code }}
  sarif-path:
    description: Path to the generated SARIF report.
    value: ${{ steps.scan.outputs.sarif-path }}
  html-path:
    description: Path to the generated HTML report.
    value: ${{ steps.scan.outputs.html-path }}
  artifact-url:
    description: URL of the uploaded HTML artifact.
    value: ${{ steps.html-artifact.outputs.artifact-url }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.11"

    - name: Install IronVeil
      shell: bash
      env:
        IRONVEIL_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check "$IRONVEIL_ACTION_PATH"

    - name: Scan repository and render reports
      id: scan
      shell: bash
      env:
        IRONVEIL_TARGET: ${{ inputs.path }}
        IRONVEIL_FAIL_SEVERITY: ${{ inputs.fail-severity }}
        IRONVEIL_MINIMUM_CONFIDENCE: ${{ inputs.minimum-confidence }}
      run: |
        results_dir="${RUNNER_TEMP}/ironveil-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        sarif_path="${results_dir}/ironveil.sarif"
        html_path="${results_dir}/ironveil-report.html"
        mkdir -p "$results_dir"

        set +e
        python -m ironveil scan "$IRONVEIL_TARGET" \
          --format sarif \
          --output "$sarif_path" \
          --fail-severity "$IRONVEIL_FAIL_SEVERITY" \
          --minimum-confidence "$IRONVEIL_MINIMUM_CONFIDENCE" \
          --no-color
        scan_exit=$?

        python -m ironveil scan "$IRONVEIL_TARGET" \
          --format html \
          --output "$html_path" \
          --minimum-confidence "$IRONVEIL_MINIMUM_CONFIDENCE" \
          --no-fail \
          --no-color
        report_exit=$?
        set -e

        if [[ "$report_exit" -ge 2 && "$scan_exit" -lt 2 ]]; then
          scan_exit="$report_exit"
        fi
        echo "exit-code=$scan_exit" >> "$GITHUB_OUTPUT"
        echo "sarif-path=$sarif_path" >> "$GITHUB_OUTPUT"
        echo "html-path=$html_path" >> "$GITHUB_OUTPUT"

    - name: Upload HTML report
      id: html-artifact
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.scan.outputs.html-path }}
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}

    - name: Upload SARIF to Code Scanning
      id: sarif-upload
      if: always() && inputs.upload-sarif == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-path }}
        category: ironveil

    - name: Write job summary
      if: always()
      shell: bash
      env:
        IRONVEIL_ACTION_PATH: ${{ github.action_path }}
        IRONVEIL_SARIF: ${{ steps.scan.outputs.sarif-path }}
        IRONVEIL_EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        IRONVEIL_TARGET: ${{ inputs.path }}
        IRONVEIL_FAIL_SEVERITY: ${{ inputs.fail-severity }}
        IRONVEIL_MINIMUM_CONFIDENCE: ${{ inputs.minimum-confidence }}
        IRONVEIL_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        IRONVEIL_ARTIFACT_URL: ${{ steps.html-artifact.outputs.artifact-url }}
      run: python "$IRONVEIL_ACTION_PATH/.github/scripts/write_action_summary.py"

    - name: Enforce IronVeil result
      if: always()
      shell: bash
      env:
        IRONVEIL_EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
      run: exit "${IRONVEIL_EXIT_CODE:-2}"
